<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TUND THEERAWIT // SIM-TO-REAL RL</title>
<link rel="stylesheet" href="styles.css" />
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a0b0c"/>
    <rect x="30" y="30" width="40" height="40" fill="#c5f500"/>
    <text x="50" y="56" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle" fill="#0a0b0c">TT</text>
  </svg>
</template>
</head>
<body>
  <!-- custom cursor: registration crosshair -->
  <div id="cursor"><span class="ring"></span><span class="tag">PROBE</span></div>
  <div id="xtrack" style="position:fixed;top:0;left:0;z-index:9998;pointer-events:none;width:46px;height:46px;mix-blend-mode:difference;">
    <span style="position:absolute;left:50%;top:0;width:1px;height:100%;background:#fff;transform:translateX(-50%);opacity:.5;"></span>
    <span style="position:absolute;top:50%;left:0;height:1px;width:100%;background:#fff;transform:translateY(-50%);opacity:.5;"></span>
    <span class="coord" style="position:absolute;left:26px;top:-14px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#fff;white-space:nowrap;"></span>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="ascii.jsx"></script>
  <script type="text/babel" src="sections-top.jsx"></script>
  <script type="text/babel" src="sections-work.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" data-presets="react">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <>
        <window.Boot />
        <window.Cursor />
        <window.App />
      </>
    );
  </script>
</body>
</html>
