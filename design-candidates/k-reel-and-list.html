<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K · Reel and list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: one screen. Every project is a line in a list on the left; a large preview on the right plays through them. */
  :root { --bg:#0f2a22; --stage:#0a1f19; --ink:#eef3ea; --mute:#9db3a6; --rule:#234438; --accent:#ff8a65; --font:"Schibsted Grotesk",system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; }
  a { color:inherit; text-decoration:none; }
  .page { min-height:100%; display:grid; grid-template-columns:minmax(330px,38fr) 62fr; gap:36px; padding:30px 40px; }
  .left { display:flex; flex-direction:column; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; }
  .lead { font-size:19px; line-height:1.4; margin-top:10px; max-width:30ch; color:#d9e3d6; }
  nav { display:flex; gap:20px; margin-top:16px; font-size:14px; }
  nav a { border-bottom:1px solid var(--mute); padding-bottom:1px; }
  nav a:hover { color:var(--accent); border-color:var(--accent); }
  .list { margin-top:auto; padding-top:26px; }
  .row { position:relative; display:grid; grid-template-columns:54px 1fr auto; gap:10px; align-items:baseline; padding:11px 0; border-top:1px solid var(--rule); color:var(--mute); cursor:pointer; transition:color .25s, padding .25s; }
  .row b { font-size:19px; font-weight:500; color:inherit; letter-spacing:-.01em; }
  .row .y { font-size:14px; font-variant-numeric:tabular-nums; }
  .row small { font-size:13px; }
  .row.on { color:var(--ink); padding-left:10px; }
  .row.on small { color:var(--accent); }
  .row i { position:absolute; left:0; top:-1px; height:2px; width:0; background:var(--accent); }
  .row.on i { animation:bar var(--dur) linear forwards; }
  .paused .row.on i { animation-play-state:paused; }
  @keyframes bar { to { width:100%; } }
  .stage { position:relative; border-radius:8px; overflow:hidden; background:var(--stage); min-height:420px; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity .7s ease; }
  .slide.on { opacity:1; }
  .slide img, .slide video, .slide .ph { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.06); transition:transform 6s ease-out; }
  .slide.on img, .slide.on video { transform:scale(1); }
  .ph { display:grid; place-items:center; text-align:center; color:#5f7f70; font-size:14px; }
  .slide::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(6,20,16,.88),transparent 45%); }
  .slide .cap { position:absolute; z-index:1; left:28px; right:28px; bottom:24px; }
  .slide .cap b { font-size:clamp(26px,3vw,40px); font-weight:700; letter-spacing:-.02em; line-height:1.1; display:block; }
  .slide .cap p { font-size:17px; color:#d9e3d6; margin-top:6px; max-width:44ch; }
  .slide .cap span { display:inline-block; margin-top:14px; font-size:14px; font-weight:500; background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:5px; }
  @media (max-width:820px){ .page{grid-template-columns:1fr; padding:22px} .stage{min-height:300px; order:-1} }
  @media (prefers-reduced-motion:reduce){ .slide img,.slide video{transition:none; transform:none} }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="left">
    <h1>Tund Theerawit</h1>
    <p class="lead">I teach robots to walk, and I build and fix the robots too.</p>
    <nav><a href="#">CV</a><a href="#">About me</a><a href="#">Email</a><a href="#">GitHub</a><a href="#">LinkedIn</a></nav>
    <div class="list" id="list"></div>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script src="r2-data.js"></script>
<script>
  const DUR = 4500, ps = [...PROJECTS].sort((a,b) => b.year - a.year);
  list.style.setProperty('--dur', DUR + 'ms');
  list.innerHTML = ps.map(p => `<div class="row" tabindex="0"><i></i><span class="y">${p.year}</span><b>${p.title}</b><small>${p.tag}</small></div>`).join('');
  stage.innerHTML = ps.map(p => `<a class="slide" href="#">${media(p)}<div class="cap"><b>${p.title}</b><p>${p.line}</p><span>See the project</span></div></a>`).join('');
  const rows = [...list.children], slides = [...stage.children]; let cur = -1, timer;
  function show(i) { cur = (i + ps.length) % ps.length;
    rows.forEach((r,j) => r.classList.toggle('on', j === cur)); slides.forEach((s,j) => s.classList.toggle('on', j === cur)); }
  function play() { clearInterval(timer); page.classList.remove('paused'); timer = setInterval(() => show(cur + 1), DUR); }
  function hold() { clearInterval(timer); page.classList.add('paused'); }
  rows.forEach((r,i) => { r.onmouseenter = r.onfocus = () => { show(i); hold(); }; });
  list.onmouseleave = () => { show(cur); play(); };
  stage.onmouseenter = hold; stage.onmouseleave = play;
  show(0); play();
</script>
</body>
</html>
