<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J · Filmstrip timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: one screen. A short intro band, then a sideways timeline of photo cards, newest first. */
  :root { --bg:#1a1a1a; --card:#262626; --ink:#f0f0ee; --mute:#9a9a96; --rule:#3a3a3a; --accent:#ef4b4e; --font:Archivo,system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; display:flex; flex-direction:column; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  header { display:grid; grid-template-columns:auto 1fr auto; gap:40px; align-items:baseline; padding:26px 40px 20px; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.02em; }
  header p { font-size:18px; color:#d5d5d1; max-width:46ch; }
  header nav a { margin-left:22px; font-size:14px; color:var(--mute); }
  header nav a:hover { color:var(--ink); }
  header nav a.cv { color:var(--bg); background:var(--ink); padding:7px 14px; border-radius:5px; font-weight:500; }
  .strip { flex:1; min-height:430px; overflow-x:auto; overflow-y:hidden; cursor:grab; scrollbar-width:none; position:relative; }
  .strip::-webkit-scrollbar { display:none; }
  .track { display:flex; align-items:flex-end; gap:16px; height:100%; padding:10px 40px 86px; width:max-content; position:relative; animation:slide 1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes slide { from { transform:translateX(90px); opacity:.2; } }
  .track::after { content:""; position:absolute; left:0; right:0; bottom:58px; height:2px; background:var(--rule); }
  .year { display:flex; align-items:flex-end; gap:16px; position:relative; height:100%; }
  .year > span { position:absolute; left:0; bottom:-80px; font-size:26px; font-weight:700; letter-spacing:-.03em; color:var(--ink); }
  .year > span small { font-size:13px; font-weight:400; color:var(--mute); letter-spacing:0; margin-left:10px; }
  .year::before { content:""; position:absolute; left:0; bottom:-35px; width:12px; height:12px; border-radius:50%; background:var(--accent); z-index:1; }
  .year + .year { margin-left:26px; }
  .card { position:relative; width:19vw; min-width:220px; max-width:320px; height:100%; max-height:520px; border-radius:5px; overflow:hidden; background:var(--card); flex:none; transition:width .45s cubic-bezier(.2,.7,.2,1); }
  .card:nth-of-type(even) { height:74%; }
  .card:hover { width:30vw; }
  .card img, .card video, .card .ph { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph { display:grid; place-items:center; text-align:center; color:#6e6e6a; font-size:13px; }
  .card::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(15,15,15,.9),transparent 50%); }
  .cap { position:absolute; z-index:1; left:16px; right:16px; bottom:14px; }
  .cap small { font-size:13px; color:#ff8f91; }
  .cap b { display:block; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.15; }
  .cap p { font-size:14px; color:#d5d5d1; margin-top:3px; }
  .hint { position:absolute; right:40px; top:84px; font-size:13px; color:var(--mute); pointer-events:none; }
  @media (max-width:760px){ header{grid-template-columns:1fr; gap:10px} header nav a:first-child{margin-left:0} }
  @media (prefers-reduced-motion:reduce){ .track{animation:none} .card{transition:none} }
</style>
</head>
<body>
<header>
  <h1>Tund Theerawit</h1>
  <p>I teach robots to walk, and I build and fix the robots too.</p>
  <nav><a href="#">About me</a><a href="#">Email</a><a href="#">GitHub</a><a class="cv" href="#">CV</a></nav>
</header>
<div class="strip" id="strip"><div class="track" id="track"></div></div>
<div class="hint">Drag or scroll sideways, 2027 back to 2023</div>
<script src="r2-data.js"></script>
<script>
  const notes = { 2027:'senior capstone', 2026:'BadgerBots', 2025:'LeggedAI Lab', 2024:'first robots' };
  const years = [...new Set(PROJECTS.map(p => p.year))].sort().reverse();
  track.innerHTML = years.map(y => `<div class="year"><span>${y}<small>${notes[y]}</small></span>` +
    PROJECTS.filter(p => p.year === y).map(p => `<a class="card" href="#">${media(p)}<div class="cap"><small>${p.tag}</small><b>${p.title}</b><p>${p.line}</p></div></a>`).join('') + `</div>`).join('');
  // Mouse wheel and drag both move the strip sideways.
  strip.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive:false });
  let down = false, sx = 0, sl = 0, moved = false;
  strip.onpointerdown = e => { down = true; moved = false; sx = e.clientX; sl = strip.scrollLeft; };
  window.onpointermove = e => { if (!down) return; if (Math.abs(e.clientX - sx) > 4) moved = true; strip.scrollLeft = sl - (e.clientX - sx); };
  window.onpointerup = () => down = false;
  strip.addEventListener('click', e => { if (moved) e.preventDefault(); }, true);
  strip.ondragstart = e => e.preventDefault();
</script>
</body>
</html>
