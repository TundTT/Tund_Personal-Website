<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I · Side panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout idea: who I am stays put on the left, the work scrolls as a mosaic on the right. */
  :root { --bg:#10151f; --panel:#18202e; --ink:#e9edf3; --mute:#8e9bb0; --rule:#263146; --accent:#f4b740; --font:Geist,system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55; }
  a { color:inherit; text-decoration:none; }
  .page { display:grid; grid-template-columns:minmax(250px,23vw) 1fr; }
  aside { position:sticky; top:0; height:100vh; padding:34px 30px; display:flex; flex-direction:column; gap:18px; border-right:1px solid var(--rule); }
  h1 { font-size:30px; font-weight:600; letter-spacing:-.02em; line-height:1.1; }
  aside .lead { font-size:18px; line-height:1.4; }
  aside .small { color:var(--mute); font-size:14px; }
  .links { display:flex; flex-direction:column; gap:2px; margin-top:6px; }
  .links a { display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--rule); font-weight:500; }
  .links a span { color:var(--mute); font-weight:400; }
  .links a:hover { color:var(--accent); }
  .kinds { margin-top:auto; display:flex; flex-wrap:wrap; gap:6px; }
  .kinds button { font:inherit; font-size:13px; color:var(--mute); background:none; border:1px solid var(--rule); border-radius:6px; padding:5px 11px; cursor:pointer; }
  .kinds button.on { color:var(--bg); background:var(--ink); border-color:var(--ink); }
  main { padding:14px; display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:calc((100vh - 28px - 4*10px)/5); gap:10px; grid-auto-flow:dense; }
  .tile { position:relative; overflow:hidden; border-radius:6px; background:var(--panel); grid-column:span 2; grid-row:span 2; animation:in .7s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i)*70ms); }
  .tile:nth-child(1) { grid-column:span 4; grid-row:span 3; }
  .tile:nth-child(3) { grid-row:span 1; }
  .tile:nth-child(7), .tile:nth-child(8) { grid-column:span 3; }
  @keyframes in { from { opacity:.0; transform:translateY(14px) scale(.985); } }
  .tile img, .tile video, .tile .ph { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .7s cubic-bezier(.2,.7,.2,1); }
  .ph { display:grid; place-items:center; text-align:center; color:#5d6b82; font-size:13px; }
  .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(10,14,22,.9),transparent 55%); transition:opacity .3s; }
  .cap { position:absolute; z-index:1; left:16px; right:16px; bottom:13px; }
  .cap b { font-size:19px; font-weight:600; letter-spacing:-.01em; display:block; }
  .tile:nth-child(1) .cap b { font-size:30px; }
  .cap small { font-size:13px; color:var(--accent); }
  .cap p { font-size:14px; color:#cdd5e2; max-height:0; opacity:0; overflow:hidden; transition:max-height .35s, opacity .35s; }
  .tile:hover .cap p, .tile:focus-visible .cap p { max-height:4em; opacity:1; }
  .tile:hover img, .tile:hover video { transform:scale(1.04); }
  .tile.dim { opacity:.18; }
  .tile { transition:opacity .3s; }
  .tile:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (max-width:820px){ .page{grid-template-columns:1fr} aside{position:static;height:auto} main{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px} .tile,.tile:nth-child(n){grid-column:span 1;grid-row:span 1} .tile:nth-child(1){grid-column:span 2;grid-row:span 2} }
  @media (prefers-reduced-motion:reduce){ .tile{animation:none} }
</style>
</head>
<body>
<div class="page">
  <aside>
    <h1>Tund Theerawit</h1>
    <p class="lead">I teach robots to walk, and I build and fix the robots too.</p>
    <p class="small">Mechanical Engineering at UW–Madison, class of 2027. Robot learning, sim-to-real and hardware.</p>
    <div class="links">
      <a href="#">CV <span>PDF</span></a>
      <a href="#">About me</a>
      <a href="#">Email</a>
      <a href="#">GitHub</a>
      <a href="#">LinkedIn</a>
    </div>
    <div class="kinds" id="kinds"></div>
  </aside>
  <main id="grid"></main>
</div>
<script src="r2-data.js"></script>
<script>
  grid.innerHTML = PROJECTS.map((p,i) => `<a class="tile" style="--i:${i}" data-k="${p.kind}" href="#">${media(p)}<div class="cap"><small>${p.tag}</small><b>${p.title}</b><p>${p.line}</p></div></a>`).join('');
  // Videos stay still until you point at them, so the page is calm at rest.
  grid.querySelectorAll('.tile').forEach(t => { const v = t.querySelector('video'); if (!v) return; v.autoplay = false; v.pause();
    t.onmouseenter = () => v.play(); t.onmouseleave = () => v.pause(); });
  const ks = ['All', ...new Set(PROJECTS.map(p => p.kind))];
  kinds.innerHTML = ks.map((k,i) => `<button class="${i?'':'on'}">${k}</button>`).join('');
  kinds.onclick = e => { if (e.target.tagName !== 'BUTTON') return; const k = e.target.textContent;
    [...kinds.children].forEach(b => b.classList.toggle('on', b === e.target));
    grid.querySelectorAll('.tile').forEach(t => t.classList.toggle('dim', k !== 'All' && t.dataset.k !== k)); };
</script>
</body>
</html>
