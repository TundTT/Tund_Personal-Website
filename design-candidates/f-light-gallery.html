<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F · Light gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#faf7f2; --ink:#1c1a17; --mute:#7a736a; --rule:#e4ded3; --hot:#d2451e; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--paper); color:var(--ink); font-family:Inter,sans-serif; line-height:1.55; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 32px; }
  nav { display:flex; justify-content:flex-end; gap:28px; padding:26px 0; font-size:14px; color:var(--mute); }
  nav a:hover { color:var(--ink); }
  header { padding:8vh 0 9vh; max-width:900px; }
  h1 { font-family:Newsreader,serif; font-weight:400; font-size:clamp(64px,9vw,128px); line-height:.95; letter-spacing:-.03em; }
  header p { font-family:Newsreader,serif; font-size:clamp(22px,2.4vw,32px); line-height:1.3; margin-top:28px; max-width:26ch; color:#3d3932; }
  header p em { color:var(--hot); }
  .links { margin-top:30px; display:flex; gap:22px; font-size:15px; }
  .links a { border-bottom:1px solid var(--ink); padding-bottom:2px; }
  .links a:hover { color:var(--hot); border-color:var(--hot); }
  .grid { columns:3; column-gap:26px; padding-bottom:90px; }
  .card { display:block; break-inside:avoid; margin-bottom:34px; }
  .pic { border-radius:6px; overflow:hidden; background:#e9e4da; }
  .pic img, .pic video { width:100%; display:block; transition:transform .6s; }
  .card:hover .pic img, .card:hover .pic video { transform:scale(1.03); }
  .ph { aspect-ratio:4/3; display:grid; place-items:center; text-align:center; color:#a39b8e; font-size:13px; border:1px dashed #cfc7b9; border-radius:6px; }
  .cap { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:12px; }
  .cap h3 { font-family:Newsreader,serif; font-weight:500; font-size:24px; letter-spacing:-.01em; }
  .cap small { font-size:12.5px; color:var(--hot); white-space:nowrap; }
  .card p { font-size:14.5px; color:var(--mute); margin-top:2px; }
  footer { border-top:1px solid var(--rule); padding:26px 0 50px; font-size:14px; color:var(--mute); }
  @media (max-width:900px){ .grid{columns:2} } @media (max-width:560px){ .grid{columns:1} }
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="#">Work</a><a href="#">About me</a><a href="#">CV</a></nav>
  <header>
    <h1>Tund Theerawit</h1>
    <p>I teach robots to walk, and I build and fix <em>the robots too.</em></p>
    <div class="links"><a href="#">CV</a><a href="#">Email</a><a href="#">GitHub</a><a href="#">LinkedIn</a></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Mechanical Engineering, UW–Madison, class of 2027</footer>
</div>
<script src="r2-data.js"></script>
<script>
  grid.innerHTML = PROJECTS.map(p => `<a class="card" href="#"><div class="pic">${media(p)}</div><div class="cap"><h3>${p.title}</h3><small>${p.tag}</small></div><p>${p.line}</p></a>`).join('');
</script>
</body>
</html>
