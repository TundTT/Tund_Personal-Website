<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E · Name first</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0c0b; --ink:#f3efe8; --mute:#a39c90; --rule:#2a2723; --hot:#ff5a1f; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:Inter,sans-serif; line-height:1.55; }
  a { color:inherit; text-decoration:none; }
  .hero { position:relative; height:88vh; min-height:520px; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:26px 4vw 0; }
  .hero > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 38%; opacity:.75; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,var(--bg) 2%,rgba(13,12,11,.55) 40%,rgba(13,12,11,.25) 100%); }
  .hero > :not(img) { position:relative; z-index:1; }
  nav { display:flex; justify-content:space-between; font-size:14px; }
  nav a { margin-left:26px; color:#ddd6ca; }
  nav a.cv { background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:99px; }
  h1 { font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:13vw; line-height:.82; letter-spacing:-.045em; margin-bottom:-.06em; white-space:nowrap; }
  .sub { display:flex; justify-content:space-between; align-items:end; gap:30px; margin-bottom:22px; }
  .sub p { font-size:clamp(17px,1.7vw,24px); max-width:30ch; line-height:1.3; }
  .sub p b { color:var(--hot); font-weight:500; }
  .sub span { font-size:14px; color:#cfc8bc; text-align:right; }
  main { padding:70px 4vw 90px; }
  .chips { display:flex; gap:8px; margin-bottom:26px; flex-wrap:wrap; }
  .chips button { font:inherit; font-size:14px; color:var(--mute); background:none; border:1px solid var(--rule); padding:7px 16px; border-radius:99px; cursor:pointer; }
  .chips button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .card { position:relative; aspect-ratio:4/5; border-radius:14px; overflow:hidden; background:#171513; display:flex; align-items:flex-end; }
  .card:nth-child(1), .card:nth-child(6) { grid-column:span 2; aspect-ratio:auto; }
  .card img, .card video, .card .ph { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .6s; }
  .card:hover img, .card:hover video { transform:scale(1.05); }
  .ph { display:grid; place-items:center; text-align:center; color:#6f695f; font-size:13px; background:repeating-linear-gradient(45deg,#171513 0 14px,#1c1a17 14px 28px); }
  .card::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(13,12,11,.92) 0%,transparent 55%); }
  .t { position:relative; z-index:1; padding:20px; }
  .t small { font-size:12.5px; color:var(--hot); }
  .t h3 { font-family:"Bricolage Grotesque",sans-serif; font-size:25px; font-weight:800; letter-spacing:-.02em; line-height:1.05; margin:4px 0 6px; }
  .t p { font-size:14px; color:#cfc9be; max-width:34ch; }
  .card.hide { display:none; }
  @media (max-width:900px){ .grid{grid-template-columns:1fr 1fr} .sub{flex-direction:column;align-items:start} .sub span{text-align:left} }
</style>
</head>
<body>
<div class="hero">
  <img src="../optimus-portfolio/public/assets/badgerbots/robots-2026.png" alt="">
  <nav><span>Madison, Wisconsin</span><span><a href="#">Work</a><a href="#">About me</a><a class="cv" href="#">CV ↗</a></span></nav>
  <div>
    <div class="sub">
      <p>I teach robots to walk, and <b>I build and fix the robots too.</b></p>
      <span>Mechanical Engineering, UW–Madison '27<br>Robot learning and hardware</span>
    </div>
    <h1>Tund Theerawit</h1>
  </div>
</div>
<main>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<script src="r2-data.js"></script>
<script>
  const kinds = ['Everything', ...new Set(PROJECTS.map(p => p.kind))];
  grid.innerHTML = PROJECTS.map(p => `<a class="card" data-k="${p.kind}" href="#">${media(p)}<div class="t"><small>${p.tag}</small><h3>${p.title}</h3><p>${p.line}</p></div></a>`).join('');
  chips.innerHTML = kinds.map((k,i) => `<button class="${i?'':'on'}">${k}</button>`).join('');
  chips.onclick = e => { if (e.target.tagName !== 'BUTTON') return;
    [...chips.children].forEach(b => b.classList.toggle('on', b === e.target));
    const k = e.target.textContent;
    [...grid.children].forEach(c => c.classList.toggle('hide', k !== 'Everything' && c.dataset.k !== k)); };
</script>
</body>
</html>
