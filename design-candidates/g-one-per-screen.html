<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G · One project per screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500;100..125,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0c; --ink:#f5f2ec; --hot:#ff5a1f; }
  * { box-sizing:border-box; margin:0; }
  html { scroll-snap-type:y mandatory; }
  body { background:var(--bg); color:var(--ink); font-family:Inter,sans-serif; line-height:1.5; }
  a { color:inherit; text-decoration:none; }
  .top { position:fixed; z-index:5; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:22px 4vw; font-size:14px; mix-blend-mode:difference; }
  .top b { font-family:Archivo,sans-serif; font-stretch:115%; font-weight:800; }
  .top a { margin-left:24px; }
  .dots { position:fixed; z-index:5; right:2vw; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; }
  .dots a { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.35); }
  .dots a.on { background:var(--hot); transform:scale(1.5); }
  section { position:relative; height:100vh; scroll-snap-align:start; overflow:hidden; display:flex; align-items:flex-end; padding:0 4vw 8vh; }
  section img, section video, section .ph { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph { display:grid; place-items:center; text-align:center; color:#6c6a66; background:repeating-linear-gradient(45deg,#131314 0 16px,#18181a 16px 32px); }
  section::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(11,11,12,.9) 0%,rgba(11,11,12,.1) 55%); }
  .t { position:relative; z-index:1; max-width:780px; }
  .t small { font-size:14px; color:var(--hot); }
  .t h2 { font-family:Archivo,sans-serif; font-stretch:112%; font-weight:800; font-size:clamp(44px,7vw,104px); line-height:.95; letter-spacing:-.03em; margin:10px 0 14px; }
  .t p { font-size:19px; color:#e1dcd2; max-width:40ch; }
  .t .go { display:inline-block; margin-top:20px; font-size:15px; border-bottom:1px solid currentColor; padding-bottom:2px; }
  .n { position:absolute; z-index:1; right:5vw; bottom:8vh; font-family:Archivo,sans-serif; font-size:15px; color:#cfc9be; }
  .intro { background:var(--hot); color:#160600; align-items:center; }
  .intro::after { display:none; }
  .intro h1 { font-family:Archivo,sans-serif; font-stretch:118%; font-weight:800; font-size:14vw; line-height:.86; letter-spacing:-.04em; }
  .intro p { font-size:clamp(18px,2vw,26px); max-width:30ch; margin-top:30px; font-weight:500; }
  .intro .hint { position:absolute; bottom:5vh; left:4vw; font-size:14px; }
</style>
</head>
<body>
<div class="top"><b>Tund Theerawit</b><span><a href="#">About me</a><a href="#">CV ↗</a></span></div>
<div class="dots" id="dots"></div>
<section class="intro">
  <div>
    <h1>Tund<br>Theerawit</h1>
    <p>I teach robots to walk, and I build and fix the robots too.</p>
  </div>
  <span class="hint">Scroll, eight projects ↓</span>
</section>
<div id="list"></div>
<script src="r2-data.js"></script>
<script>
  list.innerHTML = PROJECTS.map((p,i) => `<section>${media(p)}<div class="t"><small>${p.where} · ${p.tag}</small><h2>${p.title}</h2><p>${p.line}</p><a class="go" href="#">See the project →</a></div><span class="n">${String(i+1).padStart(2,'0')} / ${String(PROJECTS.length).padStart(2,'0')}</span></section>`).join('');
  const secs = [...document.querySelectorAll('section')];
  dots.innerHTML = secs.map(() => '<a href="#"></a>').join('');
  [...dots.children].forEach((d,i) => d.onclick = e => { e.preventDefault(); secs[i].scrollIntoView({behavior:'smooth'}); });
  new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) [...dots.children].forEach((d,i) => d.classList.toggle('on', secs[i] === e.target)); }), {threshold:.6}).observe(secs[0]);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) [...dots.children].forEach((d,i) => d.classList.toggle('on', secs[i] === e.target)); }), {threshold:.6});
  secs.forEach(s => io.observe(s));
</script>
</body>
</html>
